name: Build

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Test parser
        run: swift test

      - name: Build universal app
        run: |
          xcodebuild \
            -project OpeningBNRQuickLook.xcodeproj \
            -target OpeningBNRQuickLook \
            -configuration Release \
            SYMROOT="$RUNNER_TEMP/build" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify architectures
        run: |
          app="$RUNNER_TEMP/build/Release/OpeningBNRQuickLook.app"
          extension="$app/Contents/PlugIns/OpeningBNRPreview.appex"
          thumbnail="$app/Contents/PlugIns/OpeningBNRThumbnail.appex"

          lipo "$app/Contents/MacOS/OpeningBNRQuickLook" \
            -verify_arch arm64 x86_64
          lipo "$extension/Contents/MacOS/OpeningBNRPreview" \
            -verify_arch arm64 x86_64
          lipo "$thumbnail/Contents/MacOS/OpeningBNRThumbnail" \
            -verify_arch arm64 x86_64
